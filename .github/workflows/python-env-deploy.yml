name: Deploy Python Environment (Content Addressed)

on:
  push:
    branches:
      - main
    tags:
      - 'env-v*'
  workflow_dispatch:

jobs:
  build-python-env:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      ARTIFACT_DIR: out
      GITHUB_TOKEN: ${{ github.token }}
      PIP_CACHE_DIR: ${{ github.workspace }}\.runtime-work\pip-cache

    steps:
      - name: Checkout code and LFS assets
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Test runtime packaging rules
        shell: powershell
        run: .\tests\runtime-packaging.tests.ps1

      - name: Cache pip downloads
        uses: actions/cache@v3
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Verify VoiceOrder source assets
        shell: powershell
        run: .\scripts\verify-voiceorder-assets.ps1

      - name: Verify Vision source assets
        shell: powershell
        run: .\scripts\verify-vision-assets.ps1

      - name: Resolve package reuse plan
        id: plan
        shell: powershell
        run: .\scripts\resolve-runtime-package-plan.ps1

      - name: Cache changed Python engine
        if: steps.plan.outputs.engine_action == 'rebuild'
        id: cache-engine
        uses: actions/cache@v3
        with:
          path: python-engine.zip
          key: ${{ runner.os }}-runtime-engine-${{ steps.plan.outputs.engine_fingerprint }}

      - name: Cache changed STT package
        if: steps.plan.outputs.stt_action == 'rebuild'
        id: cache-stt
        uses: actions/cache@v3
        with:
          path: stt-assets.zip
          key: ${{ runner.os }}-runtime-stt-${{ steps.plan.outputs.stt_fingerprint }}

      - name: Cache changed TTS packages
        if: steps.plan.outputs.tts_rebuild == 'true'
        id: cache-tts
        uses: actions/cache@v3
        with:
          path: |
            tts-core-assets.zip
            tts-hf-*.zip
          key: ${{ runner.os }}-runtime-tts-changed-${{ steps.plan.outputs.tts_rebuild_fingerprint }}

      - name: Cache changed Hailo addon
        if: steps.plan.outputs.hailo_action == 'rebuild'
        id: cache-hailo
        uses: actions/cache@v3
        with:
          path: hailo-addon.zip
          key: ${{ runner.os }}-runtime-hailo-${{ steps.plan.outputs.hailo_fingerprint }}

      - name: Cache changed Vision assets
        if: steps.plan.outputs.vision_action == 'rebuild'
        id: cache-vision
        uses: actions/cache@v3
        with:
          path: vision-assets.zip
          key: ${{ runner.os }}-runtime-vision-${{ steps.plan.outputs.vision_fingerprint }}

      - name: Restore engine environment needed by a TTS rebuild
        if: steps.plan.outputs.tts_rebuild == 'true' && steps.cache-tts.outputs.cache-hit != 'true' && (steps.plan.outputs.engine_action == 'reuse' || steps.cache-engine.outputs.cache-hit == 'true')
        shell: powershell
        run: |
          if ('${{ steps.plan.outputs.engine_action }}' -eq 'reuse') {
            .\scripts\reuse-runtime-assets.ps1 -Components engine
          }
          if (Test-Path python-env) { Remove-Item python-env -Recurse -Force }
          7z x python-engine.zip -opython-env -y
          if ($LASTEXITCODE -ne 0) { throw "Unable to extract reused Python engine." }

      - name: Build Python engine
        if: steps.plan.outputs.engine_action == 'rebuild' && steps.cache-engine.outputs.cache-hit != 'true'
        shell: powershell
        run: .\scripts\build-python-env.ps1

      - name: Package Python engine
        if: steps.plan.outputs.engine_action == 'rebuild' && steps.cache-engine.outputs.cache-hit != 'true'
        shell: powershell
        run: .\scripts\package-engine.ps1

      - name: Package STT assets
        if: steps.plan.outputs.stt_action == 'rebuild' && steps.cache-stt.outputs.cache-hit != 'true'
        shell: powershell
        run: .\scripts\package-stt-assets.ps1

      - name: Prepare and package changed TTS components
        if: steps.plan.outputs.tts_rebuild == 'true' && steps.cache-tts.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          $plan = Get-Content runtime-package-plan.json -Raw -Encoding utf8 | ConvertFrom-Json
          $components = @($plan.packages | Where-Object {
            $_.action -eq 'rebuild' -and ($_.component -eq 'ttsCore' -or $_.component -like 'tts*')
          } | ForEach-Object { $_.component })
          .\scripts\prepare-speech-assets.ps1 -PythonExe .\python-env\kiosk_python.exe -Components $components
          .\scripts\package-tts-assets.ps1 -Components $components

      - name: Package Hailo addon
        if: steps.plan.outputs.hailo_action == 'rebuild' && steps.cache-hailo.outputs.cache-hit != 'true'
        shell: powershell
        run: .\scripts\package-hailo-addon.ps1

      - name: Package Vision assets
        if: steps.plan.outputs.vision_action == 'rebuild' && steps.cache-vision.outputs.cache-hit != 'true'
        shell: powershell
        run: .\scripts\package-vision-assets.ps1

      - name: Reuse unchanged assets from the previous release
        if: startsWith(github.ref, 'refs/tags/env-v')
        shell: powershell
        run: .\scripts\reuse-runtime-assets.ps1

      - name: Generate and verify runtime manifest
        if: startsWith(github.ref, 'refs/tags/env-v')
        shell: powershell
        run: |
          .\scripts\generate-runtime-artifacts.ps1
          .\scripts\verify-runtime-artifacts.ps1 -PlanPath runtime-package-plan.json

      - name: Collect release artifacts
        if: startsWith(github.ref, 'refs/tags/env-v')
        shell: powershell
        run: |
          if (Test-Path $env:ARTIFACT_DIR) { Remove-Item $env:ARTIFACT_DIR -Recurse -Force }
          New-Item -ItemType Directory -Path $env:ARTIFACT_DIR -Force | Out-Null
          $manifest = Get-Content runtime-manifest.json -Raw -Encoding utf8 | ConvertFrom-Json
          foreach ($package in $manifest.packages.PSObject.Properties.Value) {
            Copy-Item -LiteralPath $package.asset -Destination $env:ARTIFACT_DIR
          }
          foreach ($metadata in @('runtime-manifest.json', 'runtime-manifest.json.sha256', 'hash.txt')) {
            Copy-Item -LiteralPath $metadata -Destination $env:ARTIFACT_DIR
          }
          .\scripts\verify-runtime-artifacts.ps1 -ManifestPath "$env:ARTIFACT_DIR\runtime-manifest.json" -AssetDirectory $env:ARTIFACT_DIR

      - name: Publish verified draft release
        if: startsWith(github.ref, 'refs/tags/env-v')
        shell: powershell
        run: .\scripts\publish-runtime-release.ps1 -Tag $env:GITHUB_REF_NAME -ArtifactDirectory $env:ARTIFACT_DIR
